name: Build Visitas Mass APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VisitasMass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VisitasMass-v15-Camara-Conforme
          path: VisitasMass-v15-Camara-Conforme.apk
